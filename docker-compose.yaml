# Run the whole app:   docker compose up --build
# Then open:            http://localhost:8080
# Stop:                 docker compose down

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 7000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    # Supabase's direct database host is IPv6-only.
    enable_ipv6: true
